services:
  reverie-db:
    container_name: reverie-db
    image: postgres:15
    environment:
      POSTGRES_USER: reverie
      POSTGRES_PASSWORD: reverie
      POSTGRES_DB: reverie_db
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reverie -d reverie_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  reverie-api:
    build:
      context: .
    volumes:
      - ..:/reverie-api:cached
    ports:
      - 37611:37611
      - 50051:50051
    env_file:
      - ../.env.development
    command: sh -c "migrate -source file:///reverie-api/migrations -database \"$$DATABASE_DSN?sslmode=disable\" up && air"
    depends_on:
      reverie-db:
        condition: service_healthy

  reverie-web:
    build:
      context: .
    volumes:
      - ..:/reverie-api:cached
    ports:
      - 37610:37610
    working_dir: /reverie-api/web
    command: sh -c "npm install && npm run dev"
    depends_on:
      - reverie-api

  reverie-pgadmin:
    container_name: reverie-pgadmin
    image: dpage/pgadmin4:9.5
    ports:
      - 8888:80
    volumes:
      - ./pgadmin.json:/pgadmin4/servers.json
    environment:
      - PGADMIN_DEFAULT_EMAIL=reverie@example.com
      - PGADMIN_DEFAULT_PASSWORD=reverie
      - PGADMIN_CONFIG_SERVER_MODE=False
      - PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED=False
    depends_on:
      - reverie-db
