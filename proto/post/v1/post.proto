syntax = "proto3";

package post.v1;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "user/v1/user.proto";

service PostService {
  // Create a new post.
  rpc CreatePost(CreatePostRequest) returns (CreatePostResponse) {
    option (google.api.http) = {
      post: "/v1/posts"
      body: "*"
    };
  }

  // Delete a post (only the author can delete).
  rpc DeletePost(DeletePostRequest) returns (DeletePostResponse) {
    option (google.api.http) = {
      delete: "/v1/posts/{post_id}"
    };
  }

  // Get public timeline (all posts, newest first).
  rpc ListTimeline(ListTimelineRequest) returns (ListTimelineResponse) {
    option (google.api.http) = {
      get: "/v1/timeline"
    };
  }

  // List posts by a specific user.
  rpc ListUserPosts(ListUserPostsRequest) returns (ListUserPostsResponse) {
    option (google.api.http) = {
      get: "/v1/users/{user_id}/posts"
    };
  }
}

// Resources

message Post {
  string id = 1;
  string text = 2;
  user.v1.User author = 3;
  optional string reply_to_id = 4;
  optional string repost_id = 5;
  int32 reply_count = 6;
  int32 repost_count = 7;
  int32 favorite_count = 8;
  bool is_favorited = 9;
  google.protobuf.Timestamp create_time = 10;
}

// Request / Response

message CreatePostRequest {
  string text = 1;
  optional string reply_to_id = 2;
  optional string repost_id = 3;
}

message CreatePostResponse {
  Post post = 1;
}

message DeletePostRequest {
  string post_id = 1;
}

message DeletePostResponse {}

message ListTimelineRequest {
  int32 limit = 1;
  optional string cursor = 2; // create_time of the last received post (for pagination)
}

message ListTimelineResponse {
  repeated Post posts = 1;
  optional string next_cursor = 2;
}

message ListUserPostsRequest {
  string user_id = 1;
  int32 limit = 2;
  optional string cursor = 3;
}

message ListUserPostsResponse {
  repeated Post posts = 1;
  optional string next_cursor = 2;
}
